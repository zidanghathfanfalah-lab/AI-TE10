services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: satria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satria}
      POSTGRES_DB: satria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satria"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  chromadb:
    image: docker.io/chromadb/chroma:0.6.0
    restart: unless-stopped
    environment:
      CHROMA_SERVER_CORS_ALLOW_ORIGINS: '["*"]'
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m


  # ─── Backend API ──────────────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://satria:${POSTGRES_PASSWORD:-satria}@db:5432/satria
      REDIS_URL: redis://redis:6379/1
      CHROMADB_PATH: /app/data/chromadb
    volumes:
      - chromadb_local:/app/data/chromadb
      - ./agent_config.yaml:/app/agent_config.yaml:z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024m
        reservations:
          memory: 600m


  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://backend:8000
    ports:
      - "4321:4321"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  chromadb_local:
